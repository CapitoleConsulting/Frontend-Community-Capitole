name: Award community points

on:
  pull_request:
    types: [closed]
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  award-points:
    if: github.event_name == 'schedule' || (github.event.pull_request.merged == true && github.event.pull_request.user.login != 'copilot-bot')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Award points or check quarterly reset
        id: award
        run: node .github/scripts/award-points.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}

      - name: Commit quarterly reset
        if: github.event_name == 'schedule' && steps.award.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-points.json leaderboard.md README.md src/content/docs/index.mdx
          git commit -m "chore(points): quarterly leaderboard reset"
          git push

      - name: Create pull request with points update
        uses: peter-evans/create-pull-request@v6
        if: github.event_name == 'pull_request' && steps.award.outputs.updated == 'true'
        with:
          commit-message: "chore(points): award points for PR #${{ github.event.pull_request.number }}"
          branch: "points/award-pr-${{ github.event.pull_request.number }}"
          delete-branch: true
          title: "chore(points): award points for PR #${{ github.event.pull_request.number }}"
          body: |
            This PR updates the community points after merging PR #${{ github.event.pull_request.number }}.

            Updated files:
            - community-points.json
            - leaderboard.md
          add-paths: |
            community-points.json
            leaderboard.md
            README.md
            src/content/docs/index.mdx
